# ADR 默认规则集
# 版本：v0.1.0
# 日期：2026-11-17
# 角色：Zakura-Lee
#
# 字段：comm / argv / envp / qname / server_name / ino / data / pid / ppid / uid / gid / exit_code / child_pid
# 操作符：eq / contains / prefix / suffix
# verdict：allow / alert / block；severity：low / medium / high / critical
# agent_type：非 0 时，规则命中即把该进程标记为 Agent（写入 taint，接管 agent 识别）

rules:
  # ---- Agent 识别（规则引擎接管 taint 注入）----
  - id: agent-claude
    name: 识别 Claude Code
    event_type: exec
    conditions:
      - field: comm
        op: eq
        value: claude
    verdict: allow
    severity: low
    agent_type: 1

  - id: agent-codex
    name: 识别 Codex
    event_type: exec
    conditions:
      - field: comm
        op: eq
        value: codex
    verdict: allow
    severity: low
    agent_type: 1

  - id: agent-cursor
    name: 识别 Cursor
    event_type: exec
    conditions:
      - field: comm
        op: eq
        value: cursor
    verdict: allow
    severity: low
    agent_type: 1

  # ---- 可疑行为 ----
  - id: suspicious-download-exec
    name: 可疑下载后执行
    event_type: exec
    conditions:
      - field: argv
        op: contains
        value: curl
      - field: argv
        op: contains
        value: "| sh"
    verdict: alert
    severity: high

  - id: sensitive-file-access
    name: 访问敏感文件
    event_type: exec
    conditions:
      - field: argv
        op: contains
        value: .ssh/id_rsa
    verdict: alert
    severity: high

  # ---- LLM 出口识别 ----
  - id: llm-egress-deepseek
    name: DeepSeek API 出口
    event_type: sni
    conditions:
      - field: server_name
        op: suffix
        value: deepseek.com
    verdict: allow
    severity: low
